                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Payments submitted for a booking
      tags:
      - 16. Payments
    post:
      consumes:
      - application/json
      description: |-
        Only after the guide accepts (`can_pay`). `amount` must equal `total_amount`. The payment stays
        `pending` until an admin verifies it; then the booking's `payment_status` becomes `paid`.
      parameters:
      - description: Booking ID
        format: uuid
