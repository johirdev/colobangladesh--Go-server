                data:
                  $ref: '#/definitions/dto.PayOnlineResponse'
              type: object
        "409":
          description: PAYMENT_NOT_DUE | ALREADY_PAID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "502":
          description: PAYMENT_GATEWAY_ERROR
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: PAYMENT_GATEWAY_DISABLED
