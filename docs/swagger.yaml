info:
  contact:
    name: CholoBangladesh Backend
  description: |
    Backend API for **CholoBangladesh**, a tourist platform where travellers find and book verified local guides.

    ## Roles
    | Role | Who | How they sign up |
    |---|---|---|
    | `user` | Tourist (foreign or local) | **Email OTP** (3 steps), or **Google / Apple** (1 step). No phone needed and no SMS cost. |
    | `guide` | Local guide | **Bangladeshi mobile OTP** (3 steps), then profile + **NID/selfie KYC**, which an admin approves |
    | `admin` | Platform staff | Created from the `ADMIN_EMAIL` / `ADMIN_PASSWORD` env vars |

    ## Response envelope (every endpoint)
    ```json
    // success
    { "success": true,  "message": "logged in", "data": { ... }, "request_id": "..." }
    // error
    { "success": false, "message": "human readable", "error": { "code": "OTP_INVALID", "details": { "remaining_attempts": 3 }, "retry_after_seconds": 60 }, "request_id": "..." }
    ```
    * Base your UI logic on **`error.code`**, because it never changes. Show `message` to users.
    * `VALIDATION_ERROR` (422) → `error.details` is `[{ "field": "password", "rule": "strong_password", "message": "..." }]`. Show each message next to its form field.
    * On **429**, read `retry_after_seconds` (also the `Retry-After` header) and show a countdown.
    * Send `request_id` with bug reports.

    ## Tourist sign-up flow
    1. `POST /auth/register/user/send-otp` `{email}` → show the OTP screen with a resend timer (`resend_after_seconds`)
    2. `POST /auth/register/user/verify-otp` `{email, otp}` → keep `data.token` in memory
    3. `POST /auth/register/user/complete` `{registration_token, full_name, password?, country_code?}` → **logged in**
    4. If `user.onboarding.next_step == "complete_profile"` → `PATCH /users/me/profile` (`country_code` is required)

    **Google / Apple:** `POST /auth/oauth/google` or `/auth/oauth/apple` with `{id_token}` → **logged in** (`is_new_user` tells you whether to show the welcome or onboarding screens).

    ## Guide sign-up flow
    1. `POST /auth/register/guide/send-otp` `{phone: "01712345678"}`
    2. `POST /auth/register/guide/verify-otp` `{phone, otp}` → `data.token`
    3. `POST /auth/register/guide/complete` `{registration_token, full_name, password}` → **logged in**
    4. `PATCH /users/me/profile` (`date_of_birth`, `city`, ...) and `PUT /users/me/avatar`
    5. `PUT /guides/me/profile` (headline, about, languages, service areas, rate)
    6. `POST /guides/me/verification` (multipart: `nid_number`, `nid_front`, `nid_back`, `selfie`)
    7. Admin approves → `verification_status = approved` → the guide appears in `GET /guides`

    Use **`user.onboarding.next_step`** to route screens:
    `complete_profile` → `submit_verification` → `awaiting_review` → (`resubmit_verification`) → `done`.
    `onboarding.missing_fields` lists exactly which fields are missing.

    ## Tokens
    * `access_token` is a JWT that expires in `expires_in_seconds` (default 15 min). Send it as `Authorization: Bearer <token>`.
    * `refresh_token` is opaque and lasts 30 days. **It rotates on every refresh**, so always save the new one.
    * Web clients should keep the refresh token in memory or secure storage, never in `localStorage` if you can avoid it. Mobile clients should use Keychain or Keystore.
    * 401 `TOKEN_INVALID` → call `POST /auth/token/refresh` once, then retry. 401 `REFRESH_TOKEN_INVALID` or `SESSION_REVOKED` → go to login.
    * 409 `REFRESH_TOKEN_ROTATED` → another tab already refreshed. Re-read the stored token and retry.

    ## Security (what the frontend will notice)
    * **Rate limits** are enforced per IP (global, auth, OTP send) and per user (uploads). A request over the limit gets 429 `RATE_LIMITED`.
    * **OTP:** each code is valid for 5 minutes and can be used once. You can request a new code after 60 seconds, up to 5 per hour per email or phone. After 5 wrong attempts that email or phone is blocked for `USER_BLOCK_TIME`.
    * **Login lockout:** after `USER_MAX_FAILED_ATTEMPTS` wrong passwords, the account gets `ACCOUNT_TEMPORARILY_LOCKED` for `USER_BLOCK_TIME`.
    * **Captcha:** when enabled, send a Cloudflare Turnstile token in the `X-Captcha-Token` header on send-otp, login and forgot-password requests.
    * Forgot-password and OTP-login return the same response whether or not the account exists.
  title: CholoBangladesh API
  version: "1.0"
paths:
  /:
    get:
      description: |-
        Current API version, build (version, git commit, build time) and all available versions.
        Every response also carries an `X-API-Version` header. Deprecated versions add
        `Deprecation: true` and `Sunset: <date>` headers. Use it to check the server is up.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/http.VersionInfo'
              type: object
      summary: API version info
      tags:
      - 0. Meta
  /admin/bookings:
    get:
      parameters:
      - description: From / To filter by tour dates (bookings overlapping the range).
          Used by the guide schedule.
        example: "2026-12-01"
        in: query
        name: from
        type: string
      - enum:
        - unpaid
        - submitted
        - paid
        - refunded
        example: unpaid
        in: query
        name: payment_status
        type: string
      - enum:
        - pending
        - accepted
        - rejected
        - cancelled
        - completed
        example: pending
        in: query
        name: status
        type: string
      - example: "2026-12-31"
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingPage'
              type: object
      security:
      - BearerAuth: []
      summary: All bookings
      tags:
      - 18. Admin · Marketplace
  /admin/bookings/{id}/cancel:
    post:
      consumes:
      - application/json
      description: For paid bookings set `refunded=true` after refunding in the aamarPay
        merchant panel.
      parameters:
      - description: Booking ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AdminCancelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Cancel any pending/accepted booking (admin)
      tags:
      - 18. Admin · Marketplace
  /admin/bookings/{id}/complete:
    post:
      consumes:
      - application/json
      description: |-
        Only for paid bookings after the end date, once an admin has confirmed with the guide.
        `note` (required) records what was confirmed.
      parameters:
      - description: Booking ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Note
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AdminCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingResponse'
              type: object
        "409":
          description: TOUR_NOT_ENDED | BOOKING_NOT_PAID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete a tour on the tourist's behalf (admin)
      tags:
      - 18. Admin · Marketplace
  /admin/gigs:
    get:
      parameters:
      - example: 28
        in: query
        minimum: 1
        name: district_id
        type: integer
      - example: 3
        in: query
        minimum: 1
        name: division_id
        type: integer
      - example: ""
        in: query
        name: guide_id
        type: string
      - example: en
        in: query
        name: language
        type: string
      - example: 10000
        in: query
        minimum: 0
        name: max_price
        type: integer
      - example: 500
        in: query
        minimum: 0
        name: min_price
        type: integer
      - example: ""
        in: query
        name: spot_id
        type: string
      - enum:
        - draft
        - active
        - paused
        - suspended
        example: active
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.GigPage'
              type: object
      security:
      - BearerAuth: []
      summary: List all gigs (any status)
      tags:
      - 18. Admin · Marketplace
  /admin/gigs/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Gig ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AdminGigStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.GigResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Suspend / re-activate a gig
      tags:
      - 18. Admin · Marketplace
  /admin/guide-verifications:
    get:
      description: 'Oldest first. Default: all statuses; use `status=pending` for
        the queue.'
      parameters:
      - enum:
        - pending
        - approved
        - rejected
        example: pending
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminVerificationPage'
              type: object
      security:
      - BearerAuth: []
      summary: Guide KYC review queue
      tags:
      - 8. Admin
  /admin/guide-verifications/{id}:
    get:
      description: Document URLs expire after 10 minutes. Every view is written to
        the audit log.
      parameters:
      - description: Verification ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminVerificationDetailResponse'
              type: object
        "404":
          description: VERIFICATION_NOT_FOUND
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: KYC detail (decrypted NID + signed document URLs)
      tags:
      - 8. Admin
  /admin/guide-verifications/{id}/approve:
    post:
      parameters:
      - description: Verification ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: VERIFICATION_ALREADY_REVIEWED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve a guide (profile goes live)
      tags:
      - 8. Admin
  /admin/guide-verifications/{id}/reject:
    post:
      consumes:
      - application/json
      description: The reason is shown to the guide, who can fix it and resubmit.
      parameters:
      - description: Verification ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RejectVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: VERIFICATION_ALREADY_REVIEWED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reject a guide verification
      tags:
      - 8. Admin
  /admin/guides/{id}/gig-quota:
    put:
      consumes:
      - application/json
      description: |-
        Total gigs allowed = FREE_GIG_LIMIT + extra_slots. Until online slot purchase exists, admins
        grant slots after the guide pays (keep the payment reference in `note`).
      parameters:
      - description: Guide user ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Extra slots
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SetQuotaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.QuotaResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Grant extra gig slots to a guide
      tags:
      - 18. Admin · Marketplace
  /admin/payment-methods:
    get:
      produces:
      - application/json
      responses:
        "200":
