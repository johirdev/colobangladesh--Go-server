basePath: /api/v1
definitions:
  dto.AdminCancelRequest:
    properties:
      reason:
        example: Guide fell ill, tourist refunded.
        maxLength: 500
        minLength: 5
        type: string
      refunded:
        description: Refunded marks the payment as refunded (refund itself is done
          in the aamarPay merchant panel).
        example: true
        type: boolean
    required:
    - reason
    type: object
  dto.AdminCompleteRequest:
    properties:
      note:
        description: 'Note is required: what the admin confirmed with the guide.'
        example: 'Called the guide: tour finished on 22 Dec, tourist unreachable.'
        maxLength: 500
        minLength: 5
        type: string
    required:
    - note
    type: object
  dto.AdminGigStatusRequest:
    properties:
      reason:
        example: Misleading description
        maxLength: 500
        type: string
      status:
        enum:
        - active
        - suspended
        example: suspended
        type: string
    required:
    - status
    type: object
  dto.AdminUserPage:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.AdminUserResponse'
        type: array
      meta:
        $ref: '#/definitions/dto.PageMeta'
    type: object
  dto.AdminUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        example: Rahim Uddin
        type: string
      id:
        type: string
      last_login_at:
        type: string
      phone:
        example: "+8801712345678"
        type: string
      phone_verified:
        type: boolean
      role:
        example: guide
        type: string
      status:
        example: active
        type: string
      verification_status:
        example: pending
        type: string
    type: object
  dto.AdminVerificationDetailResponse:
    properties:
      avatar_url:
        type: string
      date_of_birth:
        example: "1990-01-15"
        type: string
      full_name:
        example: Rahim Uddin
        type: string
      guide_profile:
        $ref: '#/definitions/dto.GuideProfileResponse'
      id:
        type: string
      nid_back_url:
        type: string
      nid_front_url:
        type: string
      nid_last4:
        example: "4821"
        type: string
      nid_number:
        example: "19901234567894821"
        type: string
      phone:
        example: "+8801712345678"
        type: string
      rejection_reason:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: string
      selfie_url:
        type: string
      status:
        example: pending
        type: string
      submitted_at:
        type: string
      user_id:
        type: string
    type: object
  dto.AdminVerificationPage:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.AdminVerificationResponse'
        type: array
      meta:
        $ref: '#/definitions/dto.PageMeta'
    type: object
  dto.AdminVerificationResponse:
    properties:
      full_name:
        example: Rahim Uddin
        type: string
      id:
        type: string
      nid_last4:
        example: "4821"
        type: string
      phone:
        example: "+8801712345678"
        type: string
      rejection_reason:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: string
      status:
        example: pending
        type: string
      submitted_at:
        type: string
      user_id:
        type: string
    type: object
  dto.AuthResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in_seconds:
        example: 900
        type: integer
      is_new_user:
        example: false
        type: boolean
      refresh_expires_in_seconds:
        example: 2592000
        type: integer
      refresh_token:
        example: mJ0p...refresh-token
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/dto.MeResponse'
    type: object
  dto.Author:
    properties:
      avatar_url:
        type: string
      country_code:
        example: GB
        type: string
      flag_url:
        example: https://flagcdn.com/w40/gb.png
        type: string
      full_name:
        example: Emma Watson
        type: string
      id:
        example: 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        type: string
    type: object
  dto.AutofillRequest:
    properties:
      district_id:
        example: 36
        minimum: 1
        type: integer
      name:
        example: Ratargul Swamp Forest
        maxLength: 150
        minLength: 2
        type: string
    required:
    - name
    type: object
  dto.AutofillResponse:
    properties:
      draft:
        $ref: '#/definitions/dto.CreateSpotRequest'
      notes:
        example:
        - 'YouTube: set YOUTUBE_API_KEY to fetch videos automatically'
        items:
          type: string
        type: array
      sources:
        example:
        - wikipedia
        - youtube
        - google_images
        - ai
        items:
          type: string
        type: array
      suggested_upazilas:
        description: nearest upazilas to the coordinates
        items:
          $ref: '#/definitions/dto.UpazilaRef'
        type: array
    type: object
  dto.AvailabilityRequest:
    properties:
      is_available:
        example: true
        type: boolean
    required:
    - is_available
    type: object
  dto.BookedDatesResponse:
    properties:
      dates:
        example:
        - "2026-12-20"
        - "2026-12-21"
        - "2026-12-22"
        items:
          type: string
        type: array
      from:
        example: "2026-12-01"
        type: string
      gig_id:
        example: 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        type: string
      ranges:
        items:
          $ref: '#/definitions/dto.BusyRange'
        type: array
      to:
        example: "2027-03-01"
        type: string
    type: object
  dto.BookingGig:
    properties:
      duration_hours:
        example: 8
        type: number
      id:
        example: 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        type: string
      meeting_point:
        example: Mongla ferry ghat
        type: string
      title:
        example: Full-day Sundarbans boat safari
        type: string
    type: object
  dto.BookingPage:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.BookingResponse'
        type: array
      meta:
        $ref: '#/definitions/response.PageMeta'
    type: object
  dto.BookingResponse:
    properties:
      accepted_at:
        type: string
      can_accept:
        description: Actions the current user may take — drive the buttons from these.
        example: false
        type: boolean
      can_cancel:
        example: true
        type: boolean
      can_chat:
        description: 'paid: tourist <-> guide messages'
        example: false
        type: boolean
      can_complete:
        description: 'CanComplete: tourist confirms the tour is done (paid, on/after
          tour_date) — or an admin after end_date.'
        example: false
        type: boolean
      can_edit_plan:
        description: 'paid & not finished: trip plan editable'
        example: false
        type: boolean
      can_pay:
        description: accepted + unpaid (tourist)
        example: false
        type: boolean
      can_reject:
        example: false
        type: boolean
      can_review:
        example: false
        type: boolean
      cancelled_at:
        type: string
      code:
        example: CB7K3D9QXA
        type: string
      completed_at:
        type: string
      completed_by:
        description: 'CompletedBy: "tourist" or "admin".'
        example: tourist
        type: string
      completion_note:
        type: string
      created_at:
        type: string
      currency:
        example: BDT
        type: string
      days:
        example: 3
        type: integer
      end_date:
        example: "2026-12-22"
        type: string
      gig:
        $ref: '#/definitions/dto.BookingGig'
      group_size:
        example: 4
        type: integer
      guide:
        $ref: '#/definitions/dto.PersonRef'
      guide_contact:
        allOf:
        - $ref: '#/definitions/dto.Contact'
        description: visible to the tourist once accepted
      has_plan:
        example: false
        type: boolean
      has_review:
        example: false
        type: boolean
      id:
        example: 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        type: string
      note:
        type: string
      paid_at:
        type: string
      payment_status:
        enum:
        - unpaid
        - submitted
        - paid
        - refunded
        example: unpaid
        type: string
      pricing_type:
        example: per_group
        type: string
      spot:
        $ref: '#/definitions/dto.BookingSpot'
      start_time:
        example: "08:00"
        type: string
      status:
        enum:
        - pending
        - accepted
        - rejected
        - cancelled
        - completed
        example: pending
        type: string
      status_reason:
        type: string
      total_amount:
        example: 6000
        type: integer
      tour_date:
        example: "2026-12-20"
        type: string
      tourist:
        $ref: '#/definitions/dto.PersonRef'
      tourist_contact:
        allOf:
        - $ref: '#/definitions/dto.Contact'
        description: visible to the guide once accepted
      unit_price:
        example: 6000
        type: integer
    type: object
  dto.BookingSpot:
    properties:
      cover_image_url:
        type: string
      id:
        example: 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        type: string
      location_name:
        example: Mongla, Bagerhat
        type: string
      slug:
        example: sundarbans
        type: string
      title:
        example: Sundarbans
        type: string
    type: object
  dto.BulkSkipped:
    properties:
      code:
        example: SPOT_HAS_ACTIVE_GIGS
        type: string
      id:
        example: 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        type: string
      message:
        example: guides still offer tours for this spot; archive it instead of deleting
        type: string
      title:
        example: Sajek Valley
        type: string
    type: object
  dto.BulkSpotRequest:
    properties:
      action:
        enum:
        - publish
        - unpublish
        - archive
        - feature
        - unfeature
        - delete
        example: publish
        type: string
      ids:
        example:
        - 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
        uniqueItems: true
    required:
    - action
    - ids
    type: object
  dto.BulkSpotResponse:
    properties:
      action:
        example: publish
        type: string
      affected:
        description: changed (or deleted)
        example: 4
        type: integer
      requested:
        example: 5
        type: integer
      skipped:
        items:
          $ref: '#/definitions/dto.BulkSkipped'
        type: array
      unchanged:
        description: already in the requested status
        example: 0
        type: integer
    type: object
  dto.BusyRange:
    properties:
      end:
        example: "2026-12-22"
        type: string
      start:
        example: "2026-12-20"
        type: string
    type: object
  dto.CategoryCount:
    properties:
      category:
        example: beach
        type: string
      count:
        example: 6
        type: integer
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        example: OldPass2026!
        maxLength: 72
        type: string
      new_password:
        example: NewPass2026!
        type: string
    required:
    - new_password
    type: object
  dto.CompleteGuideRegistrationRequest:
    properties:
      full_name:
        example: Rahim Uddin
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: Guide2026!
        type: string
      registration_token:
        example: q4Zr8...registration-token
        maxLength: 200
        minLength: 20
        type: string
    required:
    - full_name
    - password
    - registration_token
    type: object
  dto.CompleteLocalUserRegistrationRequest:
    properties:
      city:
        example: Chattogram
        maxLength: 100
        type: string
      full_name:
        example: Tanvir Ahmed
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: Travel2026!
        type: string
      preferred_language:
        example: bn
        type: string
      registration_token:
        example: q4Zr8...registration-token
        maxLength: 200
        minLength: 20
        type: string
    required:
    - full_name
    - registration_token
    type: object
  dto.CompleteRequest:
    properties:
      note:
        example: Great tour, everything as planned.
        maxLength: 500
        type: string
    type: object
  dto.CompleteUserRegistrationRequest:
    properties:
      country_code:
        example: GB
        type: string
      full_name:
        example: Emma Watson
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: Travel2026!
        type: string
      preferred_language:
        example: en
        type: string
      registration_token:
        example: q4Zr8...registration-token
        maxLength: 200
        minLength: 20
        type: string
    required:
    - full_name
    - registration_token
    type: object
  dto.Contact:
    properties:
      email:
        example: rahim.guide@example.com
        type: string
      phone:
        example: "+8801711000001"
        type: string
      whatsapp:
        example: "+8801711000001"
        type: string
    type: object
  dto.CreateBookingRequest:
    properties:
      contact_phone:
        example: "+8801712345678"
        type: string
      end_date:
        description: 'EndDate of a multi-day tour (inclusive). Default: tour_date
          + the gig''s duration in days - 1.'
        example: "2026-12-22"
        type: string
      gig_id:
        example: 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        type: string
      group_size:
        example: 4
        maximum: 100
        minimum: 1
        type: integer
      note:
        example: Two kids in the group, we are vegetarian.
        maxLength: 1000
        type: string
      start_time:
        example: "08:00"
        type: string
      tour_date:
        example: "2026-12-20"
        type: string
    required:
    - gig_id
    - group_size
    - tour_date
    type: object
  dto.CreateGigRequest:
    properties:
      available_days:
        example:
        - fri
        - sat
        items:
          type: string
        maxItems: 7
        type: array
        uniqueItems: true
      cancellation_policy:
        example: Free cancellation up to 48 hours before the tour.
        maxLength: 1000
        type: string
      description:
        example: We start at Mongla port at 7am and cruise through the tidal creeks...
        maxLength: 10000
        minLength: 50
        type: string
      duration_hours:
        example: 8
        maximum: 720
        type: number
      excludes:
        example:
        - Hotel
        - Transport to Mongla
        items:
          type: string
        maxItems: 20
        type: array
      includes:
        example:
        - Boat ride
        - Lunch
        - Forest permit
        items:
          type: string
        maxItems: 20
        type: array
      languages:
        example:
        - bn
        - en
        items:
          type: string
        maxItems: 10
        minItems: 1
        type: array
        uniqueItems: true
      max_group_size:
        example: 10
        maximum: 100
        minimum: 1
        type: integer
      meeting_point:
        example: Mongla ferry ghat
        maxLength: 300
        type: string
      price:
        example: 6000
        maximum: 1000000
        minimum: 100
        type: integer
      pricing_type:
        enum:
        - per_person
        - per_group
        example: per_group
        type: string
      spot_id:
        example: 0193a0c4-9f7e-7c2a-a1d3-5f2b9c8e4d10
        type: string
      status:
        enum:
        - draft
        - active
        - paused
        example: active
        type: string
      title:
        example: Full-day Sundarbans boat safari with a licensed guide
        maxLength: 150
        minLength: 10
        type: string
    required:
    - description
    - duration_hours
    - languages
    - max_group_size
    - price
    - pricing_type
    - spot_id
    - title
    type: object
  dto.CreateSpotRequest:
    properties:
      best_time_to_visit:
        example: December – February
        maxLength: 120
        type: string
      bn_title:
        example: সেন্টমার্টিন দ্বীপ
        maxLength: 150
        type: string
      category:
        enum:
        - beach
        - island
        - hill
        - forest
        - waterfall
        - lake
        - river
        - wetland
        - heritage
        - religious
        - park
        - city
        - other
        example: island
        type: string
      description:
        example: Saint Martin's Island is a small coral island...
        maxLength: 20000
        minLength: 20
        type: string
      google_map_url:
        example: https://www.google.com/maps/search/?api=1&query=20.6237,92.3233
        maxLength: 500
        type: string
      highlights:
        example:
        - Coral reefs
        - Chhera Dwip
        items:
          type: string
        maxItems: 20
        type: array
      images:
        items:
          $ref: '#/definitions/dto.ImageInput'
        maxItems: 50
        type: array
      is_featured:
        example: true
        type: boolean
      latitude:
        example: 20.62375
        maximum: 27
        minimum: 20
        type: number
      location_name:
        example: Teknaf, Cox's Bazar
        maxLength: 200
        minLength: 2
        type: string
      longitude:
        example: 92.3233
        maximum: 93
        minimum: 88
        type: number
      slug:
        example: saint-martins-island
        maxLength: 120
        type: string
      source_url:
        example: https://en.wikipedia.org/wiki/St._Martin%27s_Island
        maxLength: 500
        type: string
      status:
        enum:
        - draft
        - published
        - archived
        example: published
        type: string
      subtitle:
        example: Bangladesh's only coral island
        maxLength: 300
        type: string
      title:
        example: Saint Martin's Island
        maxLength: 150
        minLength: 2
        type: string
      upazila_ids:
        example:
        - 75
        items:
          type: integer
        maxItems: 5
        minItems: 1
        type: array
        uniqueItems: true
      videos:
        items:
          $ref: '#/definitions/dto.VideoInput'
        maxItems: 20
        type: array
    required:
    - category
    - description
    - location_name
    - title
    - upazila_ids
    type: object
  dto.DeleteAccountRequest:
    properties:
      confirm:
        example: DELETE
        type: string
      password:
        example: Travel2026!
        maxLength: 72
        type: string
    required:
    - confirm
    type: object
  dto.DistrictPatch:
    properties:
      bn_name:
        example: কক্সবাজার
        maxLength: 80
        minLength: 1
        type: string
      division_id:
        example: 1
        minimum: 1
        type: integer
      latitude:
        example: 21.44315
        maximum: 90
        minimum: -90
        type: number
      longitude:
        example: 91.97977
        maximum: 180
        minimum: -180
        type: number
      name:
        example: Cox's Bazar
        maxLength: 80
        minLength: 2
        type: string
      slug:
        example: coxs-bazar
        maxLength: 80
        type: string
      website:
        example: www.coxsbazar.gov.bd
        maxLength: 255
        type: string
    type: object
  dto.DistrictRef:
    properties:
      bn_name:
        example: কক্সবাজার
        type: string
      division_id:
        example: 1
        type: integer
      id:
        example: 9
        type: integer
      name:
        example: Cox's Bazar
        type: string
      slug:
        example: coxs-bazar
        type: string
    type: object
  dto.DistrictRequest:
    properties:
      bn_name:
        example: কক্সবাজার
        maxLength: 80
        minLength: 1
        type: string
      division_id:
        example: 1
        minimum: 1
        type: integer
      latitude:
        example: 21.44315
        maximum: 90
        minimum: -90
        type: number
      longitude:
        example: 91.97977
        maximum: 180
        minimum: -180
        type: number
      name:
        example: Cox's Bazar
        maxLength: 80
        minLength: 2
        type: string
      slug:
        example: coxs-bazar
        maxLength: 80
        type: string
      website:
        example: www.coxsbazar.gov.bd
        maxLength: 255
        type: string
    required:
    - bn_name
    - division_id
    - name
    type: object
  dto.DistrictResponse:
    properties:
      bn_name:
        example: কক্সবাজার
        type: string
      division:
        $ref: '#/definitions/dto.DivisionRef'
      division_id:
        example: 1
        type: integer
      id:
        example: 9
        type: integer
      latitude:
        example: 21.44315
        type: number
      longitude:
        example: 91.97977
        type: number
      name:
        example: Cox's Bazar
        type: string
      slug:
        example: coxs-bazar
        type: string
      spot_count:
        example: 2
        type: integer
      upazila_count:
        example: 9
        type: integer
      website:
        example: www.coxsbazar.gov.bd
        type: string
    type: object
  dto.DivisionPatch:
    properties:
      bn_name:
        example: চট্টগ্রাম
        maxLength: 80
        minLength: 1
        type: string
      latitude:
        example: 22.701308
        maximum: 90
        minimum: -90
        type: number
      longitude:
        example: 91.705861
        maximum: 180
        minimum: -180
        type: number
      name:
        example: Chattogram
        maxLength: 80
        minLength: 2
        type: string
      slug:
        example: chattogram
        maxLength: 80
        type: string
    type: object
  dto.DivisionRef:
    properties:
      bn_name:
        example: চট্টগ্রাম
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Chattogram
        type: string
      slug:
        example: chattogram
        type: string
    type: object
  dto.DivisionRequest:
    properties:
      bn_name:
        example: চট্টগ্রাম
        maxLength: 80
        minLength: 1
        type: string
      latitude:
        example: 22.701308
        maximum: 90
        minimum: -90
        type: number
      longitude:
        example: 91.705861
        maximum: 180
        minimum: -180
        type: number
      name:
        example: Chattogram
        maxLength: 80
        minLength: 2
        type: string
      slug:
        example: chattogram
        maxLength: 80
        type: string
    required:
    - bn_name
    - name
    type: object
  dto.DivisionResponse:
    properties:
      bn_name:
        example: চট্টগ্রাম
        type: string
      district_count:
        example: 11
        type: integer
      id:
        example: 1
        type: integer
      latitude:
        example: 22.701308
        type: number
