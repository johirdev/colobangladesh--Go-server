        Allowed once the guide accepted (`can_pay`). Returns `payment_url`: redirect the browser there
        (bKash, Nagad, Rocket, cards…). aamarPay sends the tourist back through
        `/payments/aamarpay/return`, the API verifies the transaction server-to-server and redirects to
