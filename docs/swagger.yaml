          $ref: '#/definitions/dto.EmailOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OTPSentResponse'
              type: object
        "409":
          description: EMAIL_ALREADY_REGISTERED | CONTACT_ALREADY_VERIFIED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add / change email · Step 1 — send OTP
      tags:
      - 5. Me · Profile & account
  /users/me/contacts/email/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email + OTP
        in: body
        name: body
        required: true
        schema:
