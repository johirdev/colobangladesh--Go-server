  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        `identifier` = email (tourists) or BD mobile (guides). Wrong password returns
        `INVALID_CREDENTIALS` with `details.remaining_attempts`. After USER_MAX_FAILED_ATTEMPTS
        failures within USER_FAILED_ATTEMPT_WINDOW the account is locked for USER_BLOCK_TIME
        (`ACCOUNT_TEMPORARILY_LOCKED`, 429 + `retry_after_seconds`). Response time is identical
        whether or not the account exists.
      parameters:
      - description: Cloudflare Turnstile token (when CAPTCHA_ENABLED)
        in: header
        name: X-Captcha-Token
        type: string
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "401":
          description: INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: ACCOUNT_SUSPENDED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: ACCOUNT_TEMPORARILY_LOCKED | RATE_LIMITED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login with email/phone + password
      tags:
      - 3. Auth · Login & session
  /auth/login/otp/send:
    post:
      consumes:
      - application/json
      description: |-
        Sends a code to a verified email (tourist) or BD phone (guide). Always returns the same
        response whether or not the account exists (prevents account enumeration).
      parameters:
      - description: Cloudflare Turnstile token (when CAPTCHA_ENABLED)
        in: header
        name: X-Captcha-Token
        type: string
      - description: Email or BD phone
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.IdentifierRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OTPSentResponse'
              type: object
        "429":
          description: OTP_COOLDOWN | OTP_LIMIT_REACHED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Passwordless login · Step 1 — send OTP
      tags:
      - 3. Auth · Login & session
