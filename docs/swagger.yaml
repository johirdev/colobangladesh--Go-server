        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PhoneOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OTPSentResponse'
              type: object
        "409":
          description: PHONE_ALREADY_REGISTERED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: OTP_COOLDOWN | OTP_LIMIT_REACHED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Bangladeshi tourist sign-up · Step 1 — send SMS OTP
      tags:
      - 1. Auth · Tourist sign-up
  /auth/register/user/phone/verify-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: Phone + OTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PhoneOTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.VerificationTicketResponse'
              type: object
        "400":
          description: OTP_INVALID | OTP_EXPIRED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Bangladeshi tourist sign-up · Step 2 — verify SMS OTP
      tags:
      - 1. Auth · Tourist sign-up
  /auth/register/user/send-otp:
    post:
      consumes:
      - application/json
      description: |-
        Sends a 6-digit code to the email. Fails with `EMAIL_ALREADY_REGISTERED` (409) if the email
        already has an account (send the user to login). Re-sending is allowed after
        `resend_after_seconds`; otherwise `OTP_COOLDOWN` (429, see `retry_after_seconds`).
        Requires `X-Captcha-Token` header when captcha is enabled.
      parameters:
      - description: Cloudflare Turnstile token (when CAPTCHA_ENABLED)
        in: header
        name: X-Captcha-Token
        type: string
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.EmailOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OTPSentResponse'
              type: object
        "409":
          description: EMAIL_ALREADY_REGISTERED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: OTP_COOLDOWN | OTP_LIMIT_REACHED | RATE_LIMITED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: OTP_DELIVERY_FAILED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Tourist sign-up · Step 1 — send email OTP
      tags:
      - 1. Auth · Tourist sign-up
  /auth/register/user/verify-otp:
    post:
      consumes:
      - application/json
      description: |-
        Returns a single-use `token` (registration_token) valid for USER_REGISTRATION_TOKEN_EXPIRE_IN.
        Keep it in memory and send it with step 3. Wrong codes return `OTP_INVALID` with
        `details.remaining_attempts`; after OTP_MAX_ATTEMPTS the email is blocked for USER_BLOCK_TIME
        (`ACCOUNT_TEMPORARILY_LOCKED`, 429).
      parameters:
      - description: Email + OTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.EmailOTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.VerificationTicketResponse'
              type: object
        "400":
          description: OTP_INVALID | OTP_EXPIRED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: ACCOUNT_TEMPORARILY_LOCKED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Tourist sign-up · Step 2 — verify email OTP
      tags:
      - 1. Auth · Tourist sign-up
  /auth/token/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Call when an API returns 401 `TOKEN_INVALID`, or shortly before `expires_in_seconds`.
        The old refresh token becomes invalid — always store the new one. Re-using an old refresh
        token (theft) revokes the session. If two tabs refresh at once, the loser gets
        `REFRESH_TOKEN_ROTATED` (409): re-read the newest token from storage and retry.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "401":
          description: REFRESH_TOKEN_INVALID → redirect to login
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: REFRESH_TOKEN_ROTATED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh access token (rotates refresh token)
      tags:
      - 3. Auth · Login & session
  /bookings:
    post:
      consumes:
      - application/json
      description: |-
        Tourist accounts only. The price is fixed at booking time (`per_person` × group size or `per_group`).
        Payment is NOT taken now: it opens after the guide marks the tour completed (`can_pay`).
      parameters:
      - description: Booking
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingResponse'
              type: object
        "422":
          description: GIG_NOT_BOOKABLE | GROUP_TOO_LARGE | TOUR_DATE_IN_PAST | CANNOT_BOOK_OWN_GIG
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Book a gig
      tags:
      - 15. Bookings
  /bookings/{id}:
    get:
      description: |-
