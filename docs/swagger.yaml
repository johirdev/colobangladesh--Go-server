            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add / change BD phone · Step 2 — verify OTP
      tags:
      - 5. Me · Profile & account
  /users/me/password:
    post:
      consumes:
      - application/json
      description: |-
        `current_password` is required when `has_password` is true. Google/Apple-only accounts can
        set a first password without it. All other devices are signed out.
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: WRONG_PASSWORD
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: VALIDATION_ERROR | PASSWORD_UNCHANGED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: ACCOUNT_TEMPORARILY_LOCKED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change (or set first) password
      tags:
      - 5. Me · Profile & account
  /users/me/profile:
    patch:
      consumes:
      - application/json
      description: |-
        PATCH semantics — send only the fields that changed. Empty string clears an optional field.
        Tourists must set `country_code` to finish onboarding. Guides must set `date_of_birth`
        (18+), `city` and an avatar. A verified guide cannot change `date_of_birth`.
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "422":
          description: VALIDATION_ERROR | UNDERAGE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update my personal profile (partial)
      tags:
      - 5. Me · Profile & account
  /users/me/sessions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.SessionResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List my logged-in devices
      tags:
      - 5. Me · Profile & account
  /users/me/sessions/{id}:
    delete:
      parameters:
      - description: Session ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: SESSION_NOT_FOUND
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sign out a specific device
      tags:
      - 5. Me · Profile & account
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Type: **Bearer &lt;access_token&gt;** (from login / register / refresh)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
