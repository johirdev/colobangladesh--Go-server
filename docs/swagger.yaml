  /bookings/{id}/messages:
    get:
      description: |-
        Opens once the booking is paid. Fetching marks the other side's messages as read.
        New messages arrive live as `message:new`. Older pages: `?before=<created_at of the oldest>`.
      parameters:
      - description: Booking ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: 'Before: RFC3339 created_at of the oldest message you have (older
          page).'
        example: "2026-12-19T10:00:00Z"
        in: query
        maxLength: 40
        name: before
        type: string
      - example: 50
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
