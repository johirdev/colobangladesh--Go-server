      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OTPSentResponse'
              type: object
        "409":
          description: PHONE_ALREADY_REGISTERED | CONTACT_ALREADY_VERIFIED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add / change BD phone · Step 1 — send SMS OTP
      tags:
      - 5. Me · Profile & account
  /users/me/contacts/phone/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Phone + OTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PhoneOTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
