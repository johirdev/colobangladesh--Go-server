      parameters:
      - description: Booking ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingResponse'
              type: object
        "404":
          description: BOOKING_NOT_FOUND
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Booking details
      tags:
      - 15. Bookings
  /bookings/{id}/accept:
    post:
      parameters:
      - description: Booking ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
