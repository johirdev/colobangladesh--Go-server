            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "422":
          description: VALIDATION_ERROR | UNDERAGE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update my personal profile (partial)
      tags:
      - 5. Me · Profile & account
  /users/me/sessions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.SessionResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List my logged-in devices
      tags:
      - 5. Me · Profile & account
  /users/me/sessions/{id}:
    delete:
      parameters:
      - description: Session ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: SESSION_NOT_FOUND
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sign out a specific device
      tags:
      - 5. Me · Profile & account
