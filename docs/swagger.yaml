          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Tourist sign-up · Step 2 — verify email OTP
      tags:
      - 1. Auth · Tourist sign-up
  /auth/token/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Call when an API returns 401 `TOKEN_INVALID`, or shortly before `expires_in_seconds`.
        The old refresh token becomes invalid — always store the new one. Re-using an old refresh
        token (theft) revokes the session. If two tabs refresh at once, the loser gets
        `REFRESH_TOKEN_ROTATED` (409): re-read the newest token from storage and retry.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "401":
          description: REFRESH_TOKEN_INVALID → redirect to login
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: REFRESH_TOKEN_ROTATED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh access token (rotates refresh token)
      tags:
      - 3. Auth · Login & session
  /guides:
    get:
      description: Only approved, active and available guides are listed. Contact
        info is never exposed.
      parameters:
      - example: sylhet
        in: query
        maxLength: 60
        name: area
        type: string
      - example: en
        in: query
        name: language
        type: string
      - example: 20
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - example: 2000
        in: query
        minimum: 0
        name: max_rate
        type: integer
      - example: 300
        in: query
        minimum: 0
        name: min_rate
        type: integer
      - example: 1
        in: query
        maximum: 1000
        minimum: 1
        name: page
        type: integer
      - example: rahim
        in: query
        maxLength: 100
        name: q
        type: string
      - enum:
        - rating
        - experience
        - price_low
        - price_high
        - newest
        example: rating
        in: query
        name: sort
        type: string
      - example: tea_garden
        in: query
        maxLength: 40
        name: specialty
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.GuidePage'
              type: object
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Browse verified guides (public)
      tags:
      - 7. Guides · Public
  /guides/{id}:
    get:
      parameters:
      - description: Guide user ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.PublicGuideResponse'
              type: object
        "404":
          description: GUIDE_NOT_FOUND
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Public guide profile
      tags:
      - 7. Guides · Public
  /guides/me/availability:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Availability
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AvailabilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Toggle availability (hide/show in search)
      tags:
      - 6. Guide · My guide profile & KYC
  /guides/me/profile:
    put:
      consumes:
      - application/json
      description: |-
        Full replace (PUT). Either `hourly_rate` or `daily_rate` is required (BDT, whole taka).
        `languages`: ISO 639-1 codes (bn, en, hi...). `service_areas`: lowercase slugs (dhaka, sylhet,
        coxs-bazar...). `specialties`: see GET /guides/options.
      parameters:
      - description: Guide profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpsertGuideProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "403":
          description: FORBIDDEN (not a guide)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create / replace my guide profile
      tags:
      - 6. Guide · My guide profile & KYC
  /guides/me/verification:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.VerificationStatusResponse'
              type: object
        "404":
          description: VERIFICATION_NOT_FOUND
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Latest verification status
      tags:
      - 6. Guide · My guide profile & KYC
    post:
      consumes:
      - multipart/form-data
      description: |-
        multipart/form-data. Allowed only when `onboarding.next_step` is `submit_verification` or
        `resubmit_verification` (profile must be complete, see `GUIDE_PROFILE_INCOMPLETE.details`).
        Images: JPEG/PNG/WEBP, max MAX_UPLOAD_SIZE_MB each, min 300x300. Documents are stored privately
        (never public URLs) and the NID number is encrypted (AES-256-GCM). An admin reviews it;
        the guide gets an SMS with the result.
      parameters:
      - description: NID number (10, 13 or 17 digits)
        in: formData
        name: nid_number
        required: true
        type: string
      - description: Front side of NID
        in: formData
        name: nid_front
        required: true
        type: file
      - description: Back side of NID
        in: formData
        name: nid_back
        required: true
        type: file
      - description: Selfie holding the NID
        in: formData
        name: selfie
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.VerificationStatusResponse'
              type: object
        "409":
          description: VERIFICATION_PENDING | ALREADY_VERIFIED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: GUIDE_PROFILE_INCOMPLETE | VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: UPLOAD_UNAVAILABLE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit identity verification (NID + selfie)
      tags:
      - 6. Guide · My guide profile & KYC
  /guides/options:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.GuideOptionsResponse'
              type: object
      summary: Allowed values for guide filters/forms
      tags:
      - 7. Guides · Public
  /users/me:
    delete:
      consumes:
      - application/json
      description: |-
        Soft-deletes the account and signs out everywhere. `confirm` must be "DELETE";
        `password` is required when the account has one.
      parameters:
      - description: Confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: WRONG_PASSWORD
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: PASSWORD_REQUIRED | VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete my account
      tags:
      - 5. Me · Profile & account
    get:
      description: |-
        Full private profile. Use `onboarding.next_step` to route the user to the right screen
        after login (complete_profile | submit_verification | awaiting_review | resubmit_verification | done).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "401":
          description: UNAUTHORIZED | TOKEN_INVALID | SESSION_REVOKED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my account
      tags:
      - 5. Me · Profile & account
  /users/me/avatar:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Remove profile photo
      tags:
      - 5. Me · Profile & account
    put:
      consumes:
      - multipart/form-data
      description: |-
        multipart/form-data with field `avatar`. JPEG, PNG or WEBP, max MAX_UPLOAD_SIZE_MB, min 100x100.
        The file type is detected from its content, not its name.
      parameters:
      - description: Image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "413":
          description: PAYLOAD_TOO_LARGE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: INVALID_IMAGE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: UPLOAD_UNAVAILABLE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload / replace profile photo
      tags:
      - 5. Me · Profile & account
  /users/me/contacts/email/send-otp:
    post:
      consumes:
      - application/json
      description: Lets guides (who signed up with phone) add an email, or anyone
        change their email.
      parameters:
      - description: New email
