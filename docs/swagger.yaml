          $ref: '#/definitions/dto.EmailOTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "400":
          description: OTP_INVALID | OTP_EXPIRED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add / change email · Step 2 — verify OTP
      tags:
      - 5. Me · Profile & account
  /users/me/contacts/phone/send-otp:
    post:
      consumes:
      - application/json
      description: |-
        Optional for tourists (international numbers are not SMS-verified — use `whatsapp_number`
        in the profile instead). Guides can change their phone number here.
      parameters:
      - description: New BD phone
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PhoneOTPRequest'
