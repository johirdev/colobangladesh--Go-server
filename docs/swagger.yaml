          $ref: '#/definitions/dto.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: WRONG_PASSWORD
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: PASSWORD_REQUIRED | VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete my account
      tags:
      - 5. Me · Profile & account
    get:
      description: |-
        Full private profile. Use `onboarding.next_step` to route the user to the right screen
        after login (complete_profile | submit_verification | awaiting_review | resubmit_verification | done).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "401":
          description: UNAUTHORIZED | TOKEN_INVALID | SESSION_REVOKED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my account
      tags:
      - 5. Me · Profile & account
  /users/me/avatar:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Remove profile photo
      tags:
      - 5. Me · Profile & account
    put:
      consumes:
      - multipart/form-data
      description: |-
        multipart/form-data with field `avatar`. JPEG, PNG or WEBP, max MAX_UPLOAD_SIZE_MB, min 100x100.
        The file type is detected from its content, not its name.
      parameters:
      - description: Image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "413":
          description: PAYLOAD_TOO_LARGE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: INVALID_IMAGE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: UPLOAD_UNAVAILABLE
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload / replace profile photo
      tags:
      - 5. Me · Profile & account
  /users/me/contacts/email/send-otp:
    post:
      consumes:
      - application/json
