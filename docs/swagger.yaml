  /bookings/{id}/complete:
    post:
      consumes:
      - application/json
      description: |-
        Only the tourist can confirm, once the booking is **paid** and on/after the tour start date.
        If the tourist never confirms, an admin completes it after the end date
        (POST /admin/bookings/{id}/complete) after talking to the guide. Opens the review.
      parameters:
      - description: Booking ID
        format: uuid
        in: path
        name: id
        required: true
