          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: OAUTH_EMAIL_UNVERIFIED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: OAUTH_PROVIDER_DISABLED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Sign in with Google (tourists)
