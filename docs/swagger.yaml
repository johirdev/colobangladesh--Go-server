            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaymentMethodResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Update / (de)activate a payment method
      tags:
      - 18. Admin · Marketplace
  /admin/payments:
