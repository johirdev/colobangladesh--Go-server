# Usage
#   docker compose up -d postgres redis      # infra only (run the API with `air` / `go run`)
#   docker compose up -d --build             # full stack (API in a container)
#
# Values come from .env (compose reads it automatically for ${...}).
name: cholobangladesh

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Dhaka
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432" # localhost only, never exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # noeviction: security keys (OTP, lockouts, rate limits) must never be silently evicted.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-1.0.0}
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: cholobangladesh-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=Asia/Dhaka
      REDIS_ADDR: redis:6379
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Dev tools: browse the data in the browser (localhost only).
  #   docker compose --profile tools up -d
  #   Postgres -> http://localhost:8081   (Adminer)
  #   Redis    -> http://localhost:5540   (RedisInsight)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8081:8080"

  redisinsight:
    image: redis/redisinsight:2.70
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      # pre-configured connection, no manual setup needed
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RI_REDIS_ALIAS: cholobangladesh
      RI_ENCRYPTION_KEY: ${REDIS_PASSWORD} # encrypts saved connection passwords
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    depends_on:
      - redis
    volumes:
      - redisinsight:/data
    ports:
      - "127.0.0.1:5540:5540"

volumes:
  pgdata:
  redisdata:
  redisinsight:
