# Hot reload for local development:  air
root = "."
tmp_dir = "tmp"

[build]
  # Regenerate swagger docs, then build. On Windows air runs this through PowerShell 5.1,
  # which has no "&&" and rejects pre_cmd — so the two steps are joined with ";".
  cmd = "swag init -g cmd/server/main.go -o docs --md docs/markdown --parseInternal --quiet; go build -o ./tmp/main.exe ./cmd/server"
  bin = "tmp/main.exe"
  include_ext = ["go", "sql"]
  # docs/ is regenerated by pre_cmd on every build; watching it would cause an endless rebuild loop.
  exclude_dir = ["tmp", "bin", "docs", "vendor", ".git"]
  exclude_regex = ['_test\.go']
  delay = 500
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
